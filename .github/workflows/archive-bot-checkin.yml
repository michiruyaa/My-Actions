name: Archive Bot 签到

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  archive-bot-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Archive Bot checkin
        env:
          ARCHIVE_BOT: ${{ secrets.ARCHIVE_BOT }}
          ARCHIVE_BOT_1: ${{ secrets.ARCHIVE_BOT_1 }}
          ARCHIVE_BOT_2: ${{ secrets.ARCHIVE_BOT_2 }}
          ARCHIVE_BOT_3: ${{ secrets.ARCHIVE_BOT_3 }}
          ARCHIVE_BOT_4: ${{ secrets.ARCHIVE_BOT_4 }}
          ARCHIVE_BOT_5: ${{ secrets.ARCHIVE_BOT_5 }}
        run: python src/archive_bot/archive_bot_checkin.py
